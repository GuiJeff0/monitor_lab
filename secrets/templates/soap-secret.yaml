apiVersion: v1
kind: Secret
metadata:
  name: soap-ws-credentials
  namespace: apps
type: Opaque
stringData:
  # Credenciais para WS-Security UsernameToken
  ws-security-username: "soap_client_user"
  ws-security-password: "<CHANGE_ME_SOAP_WS_PASSWORD>"
  # Certificados X.509 para WS-Security Signature / Encryption (se aplicável)
  ws-security-cert: |
    -----BEGIN CERTIFICATE-----
    <CHANGE_ME_SOAP_CERTIFICATE_PEM>
    -----END CERTIFICATE-----
  ws-security-key: |
    -----BEGIN PRIVATE KEY-----
    <CHANGE_ME_SOAP_PRIVATE_KEY_PEM>
    -----END PRIVATE KEY-----

