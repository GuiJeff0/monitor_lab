# ──────────────────────────────────────────────────────────────────────────────
# Docker Workflow — Build & Validate
#
# Triggers on:
#   - Pull Requests (all branches)
#   - Push to main / develop
#
# Validates:
#   - Dockerfile via Hadolint (best-practice linting)
#   - docker-compose.yml syntax
#   - Docker image builds successfully
#
# NOTE: Images are NOT pushed during PRs or feature branches.
#       Pushing to a registry happens exclusively in release.yml (on git tags).
# ──────────────────────────────────────────────────────────────────────────────

name: Docker

on:
  pull_request:
    branches: ["*"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Dockerfile Lint ──────────────────────────────────────────────────────────
  hadolint:
    name: Lint Dockerfile (Hadolint)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # Fail on warnings or errors; customize ignored rules here if needed
          failure-threshold: warning

  # ── Docker Compose Validation ────────────────────────────────────────────────
  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # `docker compose config` parses and validates the compose file
      # It resolves anchors, validates structure, and catches common errors
      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

  # ── Docker Build ─────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: hadolint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up BuildKit for advanced features and layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr

      # Build the image but do NOT push it (no registry credentials for PRs)
      # Cache layers using GitHub Actions cache to speed up future builds
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Export the built image as a tarball so downstream jobs can load it
      - name: Export image as tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha

      - name: Verify image was built
        run: docker image inspect ${{ env.IMAGE_NAME }}:ci
