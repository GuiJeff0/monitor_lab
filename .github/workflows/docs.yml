# ──────────────────────────────────────────────────────────────────────────────
# Docs Workflow — Documentation Validation
#
# Triggers on:
#   - Pull Requests that touch Markdown or documentation files
#   - Push to main / develop
#
# Validates:
#   - README.md exists and is not empty
#   - Markdown syntax via markdownlint
#   - Optional: broken link detection (via lychee)
# ──────────────────────────────────────────────────────────────────────────────

name: Docs

on:
  pull_request:
    branches: ["*"]
    paths:
      - "**.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main, develop]
    paths:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  # ── README Existence Check ───────────────────────────────────────────────────
  readme-check:
    name: README Exists & Non-Empty
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify README.md exists and is non-empty
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found."
            exit 1
          fi
          if [ ! -s "README.md" ]; then
            echo "❌ README.md is empty."
            exit 1
          fi
          echo "✅ README.md exists and is non-empty."

  # ── Markdown Lint ────────────────────────────────────────────────────────────
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # markdownlint-cli2: fast, configurable Markdown linter
      # Configure rules in .markdownlint.json or .markdownlint.yaml
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          # Lint all markdown files; exclude vendor and node_modules
          globs: |
            **/*.md
            !node_modules/**
            !vendor/**

  # ── Broken Link Check ────────────────────────────────────────────────────────
  link-check:
    name: Broken Link Check
    runs-on: ubuntu-24.04
    # Runs on pushes to main only (not PRs, to avoid false positives on drafts)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lychee: fast link checker written in Rust
      # Checks HTTP/HTTPS links in all Markdown files
      - name: Run Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --max-retries 3
            --accept 200,201,204,429
            "**/*.md"
          fail: true
        env:
          # GitHub token to avoid rate-limiting on github.com links
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
