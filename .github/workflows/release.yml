# ──────────────────────────────────────────────────────────────────────────────
# Release Workflow — Tag-triggered Build, Test, and GitHub Release
#
# Triggers ONLY on version tags matching: v*.*.*
# Example: git tag v1.0.0 && git push origin v1.0.0
#
# Steps:
#   1. Run the full test suite (must pass before release)
#   2. Build the Docker image
#   3. Create a GitHub Release with auto-generated changelog
#
# To enable Docker image publishing to a registry in the future:
#   1. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to GitHub Secrets, OR
#   2. Uncomment the GHCR login and push blocks below
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"      # v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+-*"    # v1.0.0-rc1, v1.0.0-beta

permissions:
  contents: write       # Required to create GitHub Releases
  packages: write       # Required for GHCR image push (future)
  security-events: read

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Validate: Run full test suite ────────────────────────────────────────────
  validate:
    name: Run Tests Before Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run linting
        run: |
          ruff check .
          black --check .

      - name: Run type checking
        run: mypy app/ --show-error-codes

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-fail-under=80 \
            -v

  # ── Build & Push Docker Image ────────────────────────────────────────────────
  docker-release:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    needs: validate
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semantic version tag:  ghcr.io/org/repo:1.2.3
            type=semver,pattern={{version}}
            # Minor tag:             ghcr.io/org/repo:1.2
            type=semver,pattern={{major}}.{{minor}}
            # Major tag:             ghcr.io/org/repo:1
            type=semver,pattern={{major}}
            # Short SHA tag:         ghcr.io/org/repo:sha-abc1234
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # Log in to GitHub Container Registry
      # To use Docker Hub instead: change registry, username, and password secrets
      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Enable attestation for supply chain security
          provenance: true
          sbom: true

  # ── Create GitHub Release ────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: docker-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for changelog generation

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Auto-generate changelog from commits since last tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Release ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          body: |
            ## Docker Image

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ```

            ## What's Changed

            See the auto-generated release notes below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
