# ──────────────────────────────────────────────────────────────────────────────
# Security Workflow — Static Analysis, Dependency Audit & Container Scanning
#
# Triggers on:
#   - Pull Requests
#   - Push to main / develop
#   - Weekly schedule (Monday 06:00 UTC) to catch newly published CVEs
#
# Tools:
#   - Bandit  → Python source code security linter (SAST)
#   - pip-audit → Python dependency vulnerability scanner
#   - Trivy   → Container image vulnerability scanner (CVE database)
#
# Failures:
#   - HIGH or CRITICAL findings fail the pipeline.
#   - Results are uploaded to GitHub Security tab (SARIF format).
# ──────────────────────────────────────────────────────────────────────────────

name: Security

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main, develop]
  schedule:
    # Weekly scan every Monday at 06:00 UTC to catch newly published CVEs
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write # Required to upload SARIF results to GitHub Security tab

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Bandit: Python SAST ──────────────────────────────────────────────────────
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Bandit
        run: pip install bandit[toml]

      # Scan the app/ directory; output SARIF for GitHub Security tab integration
      - name: Run Bandit (SAST)
        run: |
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-results.sarif

      - name: Upload Bandit SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # ── pip-audit: Dependency Vulnerability Scan ─────────────────────────────────
  pip-audit:
    name: pip-audit (Dependency Audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip install pip-audit

      # Audit all installed packages for known CVEs
      # --strict: fail if any vulnerability is found
      - name: Run pip-audit
        run: pip-audit --strict --output text

  # ── Trivy: Container Image Scanning ─────────────────────────────────────────
  trivy:
    name: Trivy (Container Scan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the image locally so Trivy can scan it
      - name: Build Docker image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: app:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy: fail on HIGH or CRITICAL CVEs in OS packages and app libraries
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:security-scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1       # Fail the job if vulnerabilities are found
          ignore-unfixed: true  # Ignore CVEs with no fix available yet

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ── Trivy: Filesystem / Config Scan ──────────────────────────────────────────
  trivy-fs:
    name: Trivy (Filesystem & Secrets Scan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Scan the repository filesystem for misconfigurations and exposed secrets
      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload Trivy FS SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs
