name: observability-lab

networks:
  observability-net:
    driver: bridge
    name: ${DOCKER_NETWORK:-observability-net}

volumes:
  grafana-data:
  mimir-data:
  loki-data:
  tempo-data:
  adguard-work:
  adguard-conf:

services:
  # Traefik - Reverse Proxy & API Gateway
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7}
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certificates:/etc/traefik/certificates:ro
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana - Dashboards & Visualization
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.1}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SERVER_DOMAIN=monitor.lab
      - GF_SERVER_ROOT_URL=https://monitor.lab/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability-net
    depends_on:
      - mimir
      - loki
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # Grafana Mimir - Scalable Metrics & Time Series DB
  mimir:
    image: grafana/mimir:${MIMIR_VERSION:-2.15.0}
    container_name: mimir
    restart: unless-stopped
    command: "-config.file=/etc/mimir/mimir.yml"
    volumes:
      - ./mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir-data:/var/mimir
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "/bin/mimir", "-version"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mimir.rule=PathPrefix(`/mimir`)"
      - "traefik.http.routers.mimir.entrypoints=websecure"
      - "traefik.http.routers.mimir.tls=true"
      - "traefik.http.routers.mimir.middlewares=mimir-stripprefix"
      - "traefik.http.middlewares.mimir-stripprefix.stripprefix.prefixes=/mimir"
      - "traefik.http.services.mimir.loadbalancer.server.port=8080"

  # Loki - Log Aggregation System
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.4}
    container_name: loki
    restart: unless-stopped
    user: root
    command: "-config.file=/etc/loki/config.yml"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/var/loki
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "--verify-config", "-config.file=/etc/loki/config.yml"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=PathPrefix(`/loki`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.tls=true"
      - "traefik.http.routers.loki.middlewares=loki-stripprefix"
      - "traefik.http.middlewares.loki-stripprefix.stripprefix.prefixes=/loki"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"

  # Grafana Alloy - Unified Telemetry Collector (Logs, Metrics, Traces)
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.7.1}
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - observability-net
    depends_on:
      - loki
      - mimir
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana Tempo - Distributed Tracing Backend
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-3.0.0}
    container_name: tempo
    restart: unless-stopped
    command: "-config.file=/etc/tempo/tempo.yml"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - observability-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=PathPrefix(`/tempo`)"
      - "traefik.http.routers.tempo.entrypoints=websecure"
      - "traefik.http.routers.tempo.tls=true"
      - "traefik.http.routers.tempo.middlewares=tempo-stripprefix"
      - "traefik.http.middlewares.tempo-stripprefix.stripprefix.prefixes=/tempo"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"

  # AdGuard Home - Local DNS Server
  adguard:
    image: adguard/adguardhome:${ADGUARD_VERSION:-v0.107.57}
    container_name: adguard
    restart: unless-stopped
    ports:
      - "${HOST_IP:-192.168.0.7}:53:53/tcp"
      - "${HOST_IP:-192.168.0.7}:53:53/udp"
      - "3053:3000/tcp"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`dns.monitor.lab`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.tls=true"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"
