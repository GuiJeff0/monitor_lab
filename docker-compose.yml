name: observability-lab

networks:
  observability-net:
    driver: bridge
    name: ${DOCKER_NETWORK:-observability-net}

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:
  adguard-work:
  adguard-conf:

services:
  # Traefik - Reverse Proxy & API Gateway
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7}
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"

  # Grafana - Dashboards & Visualization
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.1}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SERVER_DOMAIN=monitor.lab
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability-net
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # Prometheus - Metrics Collection & Time Series DB
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.5}
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.external-url=/prometheus/"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/prometheus/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # Loki - Log Aggregation System
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.4}
    container_name: loki
    restart: unless-stopped
    user: root
    command: "-config.file=/etc/loki/config.yml"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/var/loki
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "--verify-config", "-config.file=/etc/loki/config.yml"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=PathPrefix(`/loki`)"
      - "traefik.http.routers.loki.entrypoints=web"
      - "traefik.http.routers.loki.middlewares=loki-stripprefix"
      - "traefik.http.middlewares.loki-stripprefix.stripprefix.prefixes=/loki"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"

  # Grafana Alloy - Unified Telemetry Collector (Logs, Metrics, Traces)
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.7.1}
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - observability-net
    depends_on:
      - loki

  # Promtail - Legacy Docker Log Collector
  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-3.0.0}
    container_name: promtail
    restart: unless-stopped
    command: "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - observability-net
    depends_on:
      - loki

  # Grafana Tempo - Distributed Tracing Backend
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-3.0.0}
    container_name: tempo
    restart: unless-stopped
    command: "-config.file=/etc/tempo/tempo.yml"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - observability-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=PathPrefix(`/tempo`)"
      - "traefik.http.routers.tempo.entrypoints=web"
      - "traefik.http.routers.tempo.middlewares=tempo-stripprefix"
      - "traefik.http.middlewares.tempo-stripprefix.stripprefix.prefixes=/tempo"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"

  # AdGuard Home - Local DNS Server
  adguard:
    image: adguard/adguardhome:${ADGUARD_VERSION:-v0.107.57}
    container_name: adguard
    restart: unless-stopped
    ports:
      - "${HOST_IP:-192.168.0.7}:53:53/tcp"
      - "${HOST_IP:-192.168.0.7}:53:53/udp"
      - "3053:3000/tcp"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`dns.monitor.lab`)"
      - "traefik.http.routers.adguard.entrypoints=web"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"
