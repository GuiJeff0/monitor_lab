name: observability-lab

networks:
  observability-net:
    driver: bridge
    name: ${DOCKER_NETWORK:-observability-net}

services:
  # Traefik - Reverse Proxy & API Gateway
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7}
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certificates:/etc/traefik/certificates:ro
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana - Dashboards & Visualization
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.1}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SERVER_DOMAIN=${TAILSCALE_HOSTNAME:-localhost}
      - GF_SERVER_ROOT_URL=http://${TAILSCALE_HOSTNAME:-localhost}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DATA_DIR:-./data}/grafana:/var/lib/grafana
    networks:
      - observability-net
    depends_on:
      - mimir
      - loki
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # Grafana Mimir - Scalable Metrics & Time Series DB
  mimir:
    image: grafana/mimir-alpine:${MIMIR_VERSION:-2.15.0}
    container_name: mimir
    restart: unless-stopped
    command: "-config.file=/etc/mimir/mimir.yml"
    volumes:
      - ./mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - ${DATA_DIR:-./data}/mimir:/var/mimir
    networks:
      - observability-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mimir.rule=PathPrefix(`/mimir`)"
      - "traefik.http.routers.mimir.entrypoints=web,websecure"
      - "traefik.http.routers.mimir.middlewares=mimir-stripprefix"
      - "traefik.http.middlewares.mimir-stripprefix.stripprefix.prefixes=/mimir"
      - "traefik.http.services.mimir.loadbalancer.server.port=8080"

  # Loki - Log Aggregation System
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.4}
    container_name: loki
    restart: unless-stopped
    user: root
    command: "-config.file=/etc/loki/config.yml"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - ${DATA_DIR:-./data}/loki:/var/loki
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=PathPrefix(`/loki`)"
      - "traefik.http.routers.loki.entrypoints=web,websecure"
      - "traefik.http.routers.loki.middlewares=loki-stripprefix"
      - "traefik.http.middlewares.loki-stripprefix.stripprefix.prefixes=/loki"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"

  # Grafana Alloy - Unified Telemetry Collector (Logs, Metrics, Traces)
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.7.1}
    container_name: alloy
    restart: unless-stopped
    privileged: true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
    networks:
      - observability-net
    depends_on:
      - loki
      - mimir
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana Tempo - Distributed Tracing Backend
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.6.1}
    container_name: tempo
    restart: unless-stopped
    user: root
    command: "-config.file=/etc/tempo/tempo.yml"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - ${DATA_DIR:-./data}/tempo:/var/tempo
    networks:
      - observability-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=PathPrefix(`/tempo`)"
      - "traefik.http.routers.tempo.entrypoints=web,websecure"
      - "traefik.http.routers.tempo.middlewares=tempo-stripprefix"
      - "traefik.http.middlewares.tempo-stripprefix.stripprefix.prefixes=/tempo"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"
