# ==============================================================================
# Portainer RBAC Restrito (Leitura de Cluster e Helm Releases)
# ==============================================================================
# Garante a existência do ServiceAccount do Portainer,
# fornece permissões de leitura do cluster (Nodes, Pods, Workloads, Versão, Métricas,
# e Secrets em modo somente-leitura para visualização de releases Helm como Traefik),
# mas BLOQUEIA permissões de escrita/modificação/exclusão em Secrets do cluster.
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer-sa-clusteradmin
  namespace: portainer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portainer-restricted
rules:
  # 0. Discovery da API e Versão do Cluster
  - nonResourceURLs:
      - "/version"
      - "/version/*"
      - "/api"
      - "/api/*"
      - "/apis"
      - "/apis/*"
      - "/healthz"
      - "/livez"
      - "/readyz"
    verbs: ["get"]

  # 1. Pods e Logs
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]

  # 2. Workloads (Deployments, StatefulSets, DaemonSets, ReplicaSets)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

  # 3. Networking, Configurações e Helm Releases (Secrets para leitura do Helm)
  - apiGroups: [""]
    resources:
      - services
      - endpoints
      - configmaps
      - secrets
      - namespaces
      - events
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]

  # 4. Storage
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

  # 5. Nós e Métricas
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]

  # 6. Custom Resource Definitions (Traefik IngressRoutes, Flux)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer-restricted-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portainer-restricted
subjects:
  - kind: ServiceAccount
    name: portainer-sa-clusteradmin
    namespace: portainer
