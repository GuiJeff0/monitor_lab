# ==============================================================================
# Kubernetes ResourceQuotas & LimitRanges (Prevenção de DoS e Resource Starvation)
# ==============================================================================

# 1. Quotas para o namespace 'apps' (Microsserviços)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: apps-quota
  namespace: apps
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    secrets: "15"
    configmaps: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: apps-limitrange
  namespace: apps
spec:
  limits:
    - default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      type: Container
---
# 2. Quotas para o namespace 'observability' (LGTM Stack + Alloy)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: observability
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: observability-limitrange
  namespace: observability
spec:
  limits:
    - default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      type: Container
---
# 3. Quotas para o namespace 'data' (Bancos de dados e Message Broker)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-quota
  namespace: data
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 4Gi
    limits.cpu: "6"
    limits.memory: 8Gi
    pods: "15"
    secrets: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: data-limitrange
  namespace: data
spec:
  limits:
    - default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      type: Container

