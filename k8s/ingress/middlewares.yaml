# Middlewares no namespace ingress
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailscale-ipallowlist
  namespace: ingress
spec:
  ipAllowList:
    sourceRange:
      - "127.0.0.1/32"
      - "100.64.0.0/10"
      - "192.168.0.0/16"
      - "172.16.0.0/12"
      - "10.0.0.0/8"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-stripprefix
  namespace: ingress
spec:
  stripPrefix:
    prefixes:
      - "/traefik"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-redirect
  namespace: ingress
spec:
  redirectRegex:
    regex: "^.*(/traefik/?)$"
    replacement: "/traefik/dashboard/"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-redirect
  namespace: ingress
spec:
  redirectRegex:
    regex: "^.*(/traefik/dashboard)$"
    replacement: "${1}/"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: legacy-dashboard-redirect
  namespace: ingress
spec:
  redirectRegex:
    regex: "^.*/dashboard/?$"
    replacement: "/traefik/dashboard/"
    permanent: false
---
