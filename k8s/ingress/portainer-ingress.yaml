apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portainer-ingress
  namespace: portainer
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # 1. Redireciona /portainer para /portainer/
    - match: Path(`/portainer`)
      kind: Rule
      priority: 100
      services:
        - name: portainer
          port: 9000
      middlewares:
        - name: portainer-redirect
        - name: tailscale-ipallowlist

    # 2. Roteia /portainer/ com stripPrefix para o Portainer Web UI
    - match: PathPrefix(`/portainer/`)
      kind: Rule
      priority: 50
      services:
        - name: portainer
          port: 9000
      middlewares:
        - name: portainer-stripprefix
        - name: tailscale-ipallowlist
