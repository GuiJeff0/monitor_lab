apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: monitor-lab-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/GuiJeff0/monitor_lab.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitor-lab-apps
  namespace: flux-system
spec:
  interval: 2m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: monitor-lab-repo
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 5m
  wait: true

